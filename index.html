      text-transform: uppercase;
      font-weight: 500;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
  </style>

    const BATARANG_POINTS = [{"x": -91.2, "y": -21.7}, {"x": -89.2, "y": -19.7}, {"x": -77.2, "y": -13.7}, {"x": -67.2, "y": -3.7}, {"x": -64.2, "y": 3.3}, {"x": -64.2, "y": 11.3}, {"x": -65.2, "y": 14.3}, {"x": -63.2, "y": 15.3}, {"x": -36.2, "y": 15.3}, {"x": -35.2, "y": 16.3}, {"x": -30.2, "y": 16.3}, {"x": -26.2, "y": 18.3}, {"x": -23.2, "y": 18.3}, {"x": -12.2, "y": 24.3}, {"x": -6.2, "y": 30.3}, {"x": -0.2, "y": 41.3}, {"x": 0.8, "y": 41.3}, {"x": 1.8, "y": 37.3}, {"x": 4.8, "y": 32.3}, {"x": 12.8, "y": 24.3}, {"x": 21.8, "y": 19.3}, {"x": 27.8, "y": 18.3}, {"x": 31.8, "y": 16.3}, {"x": 36.8, "y": 16.3}, {"x": 37.8, "y": 15.3}, {"x": 63.8, "y": 15.3}, {"x": 62.8, "y": 6.3}, {"x": 65.8, "y": 0.3}, {"x": 65.8, "y": -1.7}, {"x": 73.8, "y": -10.7}, {"x": 80.8, "y": -15.7}, {"x": 89.8, "y": -19.7}, {"x": 88.8, "y": -21.7}, {"x": 28.8, "y": -21.7}, {"x": 25.8, "y": -13.7}, {"x": 21.8, "y": -9.7}, {"x": 12.8, "y": -6.7}, {"x": 9.8, "y": -6.7}, {"x": 6.8, "y": -8.7}, {"x": 6.8, "y": -12.7}, {"x": 4.8, "y": -18.7}, {"x": 4.8, "y": -16.7}, {"x": 1.8, "y": -12.7}, {"x": -3.2, "y": -12.7}, {"x": -6.2, "y": -18.7}, {"x": -7.2, "y": -9.7}, {"x": -11.2, "y": -6.7}, {"x": -14.2, "y": -6.7}, {"x": -23.2, "y": -9.7}, {"x": -26.2, "y": -12.7}, {"x": -30.2, "y": -21.7}];

    const BW = 200;
    const BH = 60;
    const BR = 18;
    const BX = CX - BW / 2;
    const BY = CY - BH / 2;

    let state = 'idle';
    let t = 0;
    let lastTime = 0;

    const NUM_BATS = 36;
    let bats = [];
    let shards = [];

    function traceBatarangOutline(scale) {
      ctx.beginPath();
      for (let i = 0; i < BATARANG_POINTS.length; i++) {
        const p = BATARANG_POINTS[i];
        if (i === 0) ctx.moveTo(p.x * scale, p.y * scale);
        else ctx.lineTo(p.x * scale, p.y * scale);
      }
      ctx.closePath();
    }

    function createButtonShards() {
      shards = [];
      const cols = 6;
      const rows = 3;
      const cellW = BW / cols;
      const cellH = BH / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const originX = BX + (c + 0.5) * cellW + (Math.random() - 0.5) * 6;
          const originY = BY + (r + 0.5) * cellH + (Math.random() - 0.5) * 4;

          const pts = [];
          const sides = 5 + Math.floor(Math.random() * 2);
          const rad = 14 + Math.random() * 8;
          for (let s = 0; s < sides; s++) {
            const angle = (s / sides) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
            pts.push({
              x: Math.cos(angle) * rad * (0.7 + Math.random() * 0.4),
              y: Math.sin(angle) * rad * (0.5 + Math.random() * 0.4)
            });
          }

          const scatterAngle = Math.atan2(originY - CY, originX - CX) + (Math.random() - 0.5) * 0.4;
          const speed = 90 + Math.random() * 110;

          shards.push({
            x: originX,
            y: originY,
            startX: originX,
            startY: originY,
            targetX: originX + Math.cos(scatterAngle) * speed,
            targetY: originY + Math.sin(scatterAngle) * speed * 0.7 + 20,
            pts,
            rotSpeed: (Math.random() - 0.5) * 6,
            delay: (1 - (originX - BX) / BW) * 0.35 + Math.random() * 0.1
          });
        }
      }
    }

    function initBats() {
      bats = [];
      const perimeter = 2 * (BW + BH);

      for (let i = 0; i < NUM_BATS; i++) {
        const distOnEdge = (i / NUM_BATS) * perimeter;
        let startX, startY;

        if (distOnEdge < BW) {
          startX = BX + distOnEdge;
          startY = BY;
        } else if (distOnEdge < BW + BH) {
          startX = BX + BW;
          startY = BY + (distOnEdge - BW);
        } else if (distOnEdge < 2 * BW + BH) {
          startX = BX + BW - (distOnEdge - BW - BH);
          startY = BY + BH;
        } else {
          startX = BX;
          startY = BY + BH - (distOnEdge - 2 * BW - BH);
        }

        const outAngle = Math.atan2(startY - CY, startX - CX) + (Math.random() - 0.5) * 0.3;
        const blastDist = 100 + Math.random() * 90;

        const ptIdx = Math.floor((i / NUM_BATS) * BATARANG_POINTS.length);
        const targetPt = BATARANG_POINTS[ptIdx];

        bats.push({
          x: startX,
          y: startY,
          startX,
          startY,
          biteRadius: 7 + Math.random() * 6,
          peelDelay: (1 - (startX - BX) / BW) * 0.5 + Math.random() * 0.15,
          burstX: CX + Math.cos(outAngle) * blastDist,
          burstY: CY + Math.sin(outAngle) * (blastDist * 0.7),
          orbitAngle: outAngle,
          orbitRadius: 70 + Math.random() * 35,
          orbitSpeed: (2.4 + Math.random() * 1.6) * (Math.random() > 0.5 ? 1 : -1),
          targetX: CX + targetPt.x,
          targetY: CY + targetPt.y,
          size: 0.9 + Math.random() * 0.5,
          rot: outAngle + Math.PI / 2,
          rotSpeed: (Math.random() - 0.5) * 8,
          flapPhase: Math.random() * Math.PI * 2,
          flapSpeed: 12 + Math.random() * 10
        });
      }

      createButtonShards();
    }

    function drawRoundedRectPath(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.quadraticCurveTo(x + w, y, x + w, y + r);
      c.lineTo(x + w, y + h - r);
      c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      c.lineTo(x + r, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - r);
      c.lineTo(x, y + r);
      c.quadraticCurveTo(x, y, x + r, y);
      c.closePath();
    }

    function drawButton(alpha, activeBites = []) {
      if (alpha <= 0.005) return;
      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.shadowColor = 'rgba(0, 0, 0, 0.18)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 10;

      drawRoundedRectPath(ctx, BX - 1.5, BY - 1.5, BW + 3, BH + 3, BR + 1.5);
      const rimGrad = ctx.createLinearGradient(BX, BY, BX, BY + BH);
      rimGrad.addColorStop(0, '#52525b');
      rimGrad.addColorStop(0.5, '#3f3f46');
      rimGrad.addColorStop(1, '#18181b');
      ctx.fillStyle = rimGrad;
      ctx.fill();

      ctx.shadowColor = 'transparent';

      ctx.save();
      if (activeBites.length > 0) {
        ctx.beginPath();
        drawRoundedRectPath(ctx, BX, BY, BW, BH, BR);
        for (const b of activeBites) {
          ctx.moveTo(b.x + b.r, b.y);
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2, true);
        }
        ctx.clip('evenodd');
      } else {
        drawRoundedRectPath(ctx, BX, BY, BW, BH, BR);
        ctx.clip();
      }

      const bodyGrad = ctx.createLinearGradient(BX, BY, BX, BY + BH);
      bodyGrad.addColorStop(0, '#2e2e33');
      bodyGrad.addColorStop(0.4, '#1f1f23');
      bodyGrad.addColorStop(1, '#131316');
      ctx.fillStyle = bodyGrad;
      ctx.fillRect(BX, BY, BW, BH);

      ctx.globalAlpha = alpha * 0.14;
      const sp = 4;
      for (let py = BY; py < BY + BH; py += sp) {
        const offset = ((py - BY) / sp % 2 === 0) ? 0 : sp / 2;
        for (let px = BX; px < BX + BW; px += sp) {
          ctx.beginPath();
          ctx.arc(px + offset, py, 0.7, 0, Math.PI * 2);
          ctx.fillStyle = '#a1a1aa';
          ctx.fill();
        }
      }

      ctx.globalAlpha = alpha;
      ctx.font = '500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#e4e4e7';
      ctx.fillText("i'm batman", CX, CY + 0.5);

      ctx.restore();
      ctx.restore();
    }

    function drawBatVector(x, y, scale, rotation, alpha, flap) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.save();
      ctx.translate(x + 3, y + 8);
      ctx.rotate(rotation);
      ctx.scale((1 + flap * 0.2) * scale, scale * 0.45);
      renderBatPath();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
      ctx.fill();
      ctx.restore();

      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale((1 + flap * 0.2) * scale, scale);
      renderBatPath();
      ctx.fillStyle = '#18181b';
      ctx.fill();

      ctx.restore();
    }

    function renderBatPath() {
      ctx.beginPath();
      ctx.moveTo(0, -3.5);
      ctx.lineTo(-2, -6.5);
      ctx.lineTo(-3.5, -3.5);
      ctx.bezierCurveTo(-7, -5.5, -11, -4.5, -14, -2.5);
      ctx.bezierCurveTo(-12, -0.5, -10, 0.5, -8.5, 0);
      ctx.bezierCurveTo(-7, 1.5, -5.5, 2.5, -4, 2.8);
      ctx.bezierCurveTo(-2.5, 2, -1.5, 3.2, -1, 4);
      ctx.lineTo(0, 2.8);
      ctx.lineTo(1, 4);
      ctx.bezierCurveTo(1.5, 3.2, 2.5, 2, 4, 2.8);
      ctx.bezierCurveTo(5.5, 2.5, 7, 1.5, 8.5, 0);
      ctx.bezierCurveTo(10, 0.5, 12, -0.5, 14, -2.5);
      ctx.bezierCurveTo(11, -4.5, 7, -5.5, 3.5, -3.5);
      ctx.lineTo(2, -6.5);
      ctx.closePath();

    function drawBatarang(cx, cy, scale, alpha) {

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;

      if (BATARANG_IMG.complete && BATARANG_IMG.naturalWidth > 0) {
        const w = BATARANG_IMG.naturalWidth;
        const h = BATARANG_IMG.naturalHeight;
        ctx.drawImage(BATARANG_IMG, -w / 2, -h / 2, w, h);
      } else {
        traceBatarangOutline(1);
        ctx.fillStyle = '#18181b';
        ctx.fill();
      }

      ctx.restore();
    }

    function drawShard(s, x, y, rot, alpha) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.save();
      ctx.translate(x + 2, y + 5);
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(s.pts[0].x, s.pts[0].y);
      for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.14)';
      ctx.fill();
      ctx.restore();

      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(s.pts[0].x, s.pts[0].y);
      for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
      ctx.closePath();
      const grad = ctx.createLinearGradient(-10, -10, 10, 10);
      grad.addColorStop(0, '#3f3f46');
      grad.addColorStop(1, '#18181b');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(113, 113, 122, 0.4)';
      ctx.lineWidth = 0.5;
      ctx.stroke();

      ctx.restore();
    }

    const easeOutCubic = (v) => 1 - Math.pow(1 - Math.max(0, Math.min(1, v)), 3);
    const easeInCubic = (v) => Math.pow(Math.max(0, Math.min(1, v)), 3);
    const easeInOutCubic = (v) => {
      v = Math.max(0, Math.min(1, v));
      return v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
    };
    const easeOutBack = (v) => {
      v = Math.max(0, Math.min(1, v));
      const c = 1.70158;
      return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2);
    };

    const D_NIBBLE = 0.9;
    const D_SHATTER = 0.5;
    const D_SWIRL = 1.2;
    const D_CONVERGE = 0.8;
    const D_BURST = 0.5;
    const D_BSWIRL = 1.1;
    const D_REFORM = 0.9;

    function animate(now) {
      if (!lastTime) lastTime = now;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      t += dt;

      ctx.clearRect(0, 0, W, H);

      if (state === 'idle') {
        drawButton(1);
      } else if (state === 'forward') {
        renderForward(dt);
      } else if (state === 'batarang') {
        drawBatarang(CX, CY, 1, 1);
      } else if (state === 'reverse') {
        renderReverse(dt);
      }

      requestAnimationFrame(animate);
    }

    function renderForward(dt) {
      const p1 = t / D_NIBBLE;
      const p2 = (t - D_NIBBLE) / D_SHATTER;
      const p3 = (t - D_NIBBLE - D_SHATTER) / D_SWIRL;
      const p4 = (t - D_NIBBLE - D_SHATTER - D_SWIRL) / D_CONVERGE;

      if (p2 < 0.8) {
        const activeBites = [];
        if (p1 >= 0) {
          const biteCount = Math.min(NUM_BATS, Math.floor(easeOutCubic(p1) * NUM_BATS * 1.2));
          for (let i = 0; i < biteCount && i < NUM_BATS; i++) {
            const b = bats[i];
            activeBites.push({
              x: b.startX,
              y: b.startY,
              r: b.biteRadius * easeOutCubic(Math.min(1, p1 * 1.4))
            });
          }
        }
        const btnAlpha = p2 >= 0 ? Math.max(0, 1 - easeInCubic(p2 * 2.2)) : 1;
        drawButton(btnAlpha, activeBites);
      }

      if (p2 >= 0 && p2 <= 1.2) {
        for (const s of shards) {
          const sp = (p2 - s.delay) / (1 - s.delay);
          if (sp <= 0) continue;
          const e = easeOutCubic(Math.min(1, sp));
          const sx = s.startX + (s.targetX - s.startX) * e;
          const sy = s.startY + (s.targetY - s.startY) * e;
          const sa = Math.max(0, 1 - easeInCubic(sp * 1.1));
          drawShard(s, sx, sy, s.rotSpeed * sp * 2, sa);
        }
      }

      for (let i = 0; i < NUM_BATS; i++) {
        const b = bats[i];
        let bx, by, alpha = 0, rot, flap;

        if (p4 >= 0) {
          const prog = easeInOutCubic(Math.min(1, Math.max(0, (p4 - i * 0.008) / 0.85)));
          bx = b.x + (b.targetX - b.x) * prog;
          by = b.y + (b.targetY - b.y) * prog;
          rot = b.rot + b.rotSpeed * t * (1 - prog);
          flap = Math.sin(b.flapPhase + t * b.flapSpeed) * (1 - prog);
          alpha = prog > 0.75 ? Math.max(0, 1 - (prog - 0.75) / 0.25) : 1;
        } else if (p3 >= 0) {
          b.orbitAngle += b.orbitSpeed * dt;
          const targetR = 72 + Math.sin(b.orbitAngle * 1.5 + i * 0.4) * 22;
          b.orbitRadius += (targetR - b.orbitRadius) * 0.06;
          bx = CX + Math.cos(b.orbitAngle) * b.orbitRadius;
          by = CY + Math.sin(b.orbitAngle) * b.orbitRadius * 0.78;
          b.x = bx;
          b.y = by;
          rot = b.rot + b.rotSpeed * t;
          flap = Math.sin(b.flapPhase + t * b.flapSpeed);
          alpha = 1;
        } else if (p2 >= 0) {
          const prog = easeOutCubic(Math.min(1, Math.max(0, (p2 - i * 0.01) / 0.8)));
          bx = b.startX + (b.burstX - b.startX) * prog;
          by = b.startY + (b.burstY - b.startY) * prog;
          b.x = bx;
          b.y = by;
          rot = b.rot + b.rotSpeed * t;
          flap = Math.sin(b.flapPhase + t * b.flapSpeed);
          alpha = Math.min(1, prog * 4);
          b.orbitAngle = Math.atan2(by - CY, bx - CX);
          b.orbitRadius = Math.hypot(bx - CX, by - CY);
        } else if (p1 >= 0) {
          const peelProg = (p1 - b.peelDelay) / 0.35;
          if (peelProg <= 0) continue;
          const ep = easeOutCubic(Math.min(1, peelProg));
          const angle = Math.atan2(b.startY - CY, b.startX - CX);
          bx = b.startX + Math.cos(angle) * 26 * ep;
          by = b.startY + Math.sin(angle) * 26 * ep;
          rot = angle + Math.PI / 2 + b.rotSpeed * t * 0.4;
          flap = Math.sin(b.flapPhase + t * b.flapSpeed) * ep;
          alpha = ep;
        }

        if (alpha > 0.01) {
          drawBatVector(bx, by, b.size, rot, alpha, flap);
        }
      }

      if (p4 >= 0.35) {
        const bp = (p4 - 0.35) / 0.65;
        const bAlpha = easeInCubic(bp);
        const bScale = 0.72 + 0.28 * easeOutBack(bp);
        drawBatarang(CX, CY, bScale, bAlpha);
      }

      if (p4 >= 1) {
        state = 'batarang';
        t = 0;
        hint.textContent = 'Click to reconstruct';
      }
    }

    function renderReverse(dt) {
      const p1 = t / D_BURST;
      const p2 = (t - D_BURST) / D_BSWIRL;
      const p3 = (t - D_BURST - D_BSWIRL) / D_REFORM;

      if (p1 < 0.7) {
        const bAlpha = Math.max(0, 1 - easeInCubic(p1 * 2.5));
        drawBatarang(CX, CY, 1 + p1 * 0.14, bAlpha);
      }

      for (let i = 0; i < NUM_BATS; i++) {
        const b = bats[i];
        let bx, by, alpha = 0, rot, flap;

        if (p3 >= 0) {
          const prog = easeInOutCubic(Math.min(1, Math.max(0, (p3 - i * 0.008) / 0.85)));
          bx = b.x + (b.startX - b.x) * prog;
          by = b.y + (b.startY - b.y) * prog;
          rot = b.rot + b.rotSpeed * t * (1 - prog);
          flap = Math.sin(b.flapPhase + t * b.flapSpeed) * (1 - prog);
          alpha = prog > 0.7 ? Math.max(0, 1 - (prog - 0.7) / 0.3) : 1;
        } else if (p2 >= 0) {
          b.orbitAngle += b.orbitSpeed * dt;
          const targetR = 70 + Math.sin(b.orbitAngle * 1.5 + i * 0.4) * 22;
          b.orbitRadius += (targetR - b.orbitRadius) * 0.06;
          bx = CX + Math.cos(b.orbitAngle) * b.orbitRadius;
          by = CY + Math.sin(b.orbitAngle) * b.orbitRadius * 0.78;
          b.x = bx;
          b.y = by;
          rot = b.rot + b.rotSpeed * t;
          flap = Math.sin(b.flapPhase + t * b.flapSpeed);
          alpha = 1;
        } else if (p1 >= 0) {
          const prog = easeOutCubic(Math.min(1, Math.max(0, (p1 - i * 0.01) / 0.8)));
          bx = b.targetX + (b.burstX - b.targetX) * prog;
          by = b.targetY + (b.burstY - b.targetY) * prog;
          b.x = bx;
          b.y = by;
          rot = b.rotSpeed * t;
          flap = Math.sin(b.flapPhase + t * b.flapSpeed);
          alpha = Math.min(1, prog * 4);
          b.orbitAngle = Math.atan2(by - CY, bx - CX);
          b.orbitRadius = Math.hypot(bx - CX, by - CY);
        }

        if (alpha > 0.01) {
          drawBatVector(bx, by, b.size, rot, alpha, flap);
        }
      }

      if (p3 >= 0 && p3 <= 0.8) {
        for (const s of shards) {
          const sp = Math.min(1, Math.max(0, (p3 - s.delay * 0.5) / 0.7));
          if (sp <= 0.02 || sp >= 0.95) continue;
          const prog = easeInOutCubic(sp);
          const sx = s.targetX + (s.startX - s.targetX) * prog;
          const sy = s.targetY + (s.startY - s.targetY) * prog;
          const sa = (1 - prog) * 0.65;
          drawShard(s, sx, sy, s.rotSpeed * (1 - prog), sa);
        }
      }

      if (p3 >= 0.3) {
        const bp = (p3 - 0.3) / 0.7;
        drawButton(easeOutCubic(bp));
      }

      if (p3 >= 1) {
        state = 'idle';
        t = 0;
        hint.textContent = 'Click to summon';
      }
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width);
      const my = (e.clientY - rect.top) * (H / rect.height);

      if (state === 'idle') {
        if (mx >= BX && mx <= BX + BW && my >= BY && my <= BY + BH) {
          initBats();
          state = 'forward';
          t = 0;
          hint.textContent = '';
        }
      } else if (state === 'batarang') {
        const dist = Math.hypot(mx - CX, my - CY);
        if (dist < 140) {
          state = 'reverse';
          t = 0;
          hint.textContent = '';
        }
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width);
      const my = (e.clientY - rect.top) * (H / rect.height);

      if (state === 'idle') {
        const onButton = (mx >= BX && mx <= BX + BW && my >= BY && my <= BY + BH);
        canvas.style.cursor = onButton ? 'pointer' : 'default';
      } else if (state === 'batarang') {
        const onBatarang = Math.hypot(mx - CX, my - CY) < 140;
        canvas.style.cursor = onBatarang ? 'pointer' : 'default';
      } else {
        canvas.style.cursor = 'default';
      }
    });

    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
